[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "leakcheck"
version = "1.0.0"
description = "Screen a reported classification result for the signature of resampling before the train/test split"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
keywords = ["data leakage", "class imbalance", "SMOTE", "reproducibility", "peer review"]
dependencies = ["numpy>=1.21"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
table = ["pandas>=1.3"]
dev = ["pytest>=7", "pandas>=1.3", "scikit-learn>=1.1"]

[project.scripts]
leakcheck = "leakcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leakcheck = ["model.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
